name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate against the Agent Skills specification
        run: node scripts/validate-skills.mjs

      - name: Validate packaging manifests
        run: node scripts/validate-manifests.mjs

      - name: Check the installer runs
        run: |
          bash scripts/install.sh --dest "$RUNNER_TEMP/skills" --dry-run
          bash scripts/install.sh --dest "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/sitecoreai-migration-playbook/SKILL.md"
